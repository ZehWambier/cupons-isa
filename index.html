<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{padding-top:calc(20px + env(safe-area-inset-top,0px))!important;-webkit-tap-highlight-color:transparent}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: talão vertical de ingressos destacáveis, abre com o ingresso-capa e fecha com o coringa; toque abre o vale numa folha inferior. Visual único (talão vermelho sobre papel), sem tema escuro, por escolha. */
:root{
  --paper:#f6efe6;
  --ink:#2a1414;
  --red:#d90f12;
  --red-deep:#a8090c;
  --cream:#fbe9de;
  --muted:#7a5a55;
  --stamp:#1d3b8f;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.note{font-family:var(--hand);font-size:24px;line-height:1.15;color:var(--red-deep);margin:0;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.cat{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:10px 0 -4px;list-style:none}
.tab{font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:7px 12px;border:2px solid #2a141426;background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.luck{font:inherit;font-family:var(--display);font-size:15px;letter-spacing:.03em;background:var(--ink);color:var(--cream);border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
.luck:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.book{display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}

/* Ingresso */
.ticket{position:relative;display:grid;grid-template-columns:58px 18px 14px 1fr 86px;align-items:center;
  background:var(--red);color:var(--cream);border-radius:14px;min-height:132px;cursor:pointer;border:0;width:100%;
  text-align:left;font:inherit;padding:0;transition:transform .15s ease, filter .15s ease;
  -webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
button.ticket:hover{transform:translateY(-2px)}
button.ticket:active{transform:scale(.985)}
.ticket:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%}
.stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:19px;line-height:.95;letter-spacing:.02em;text-align:center}
.stub svg{width:30px;height:14px;flex:none}
.stub svg.bot{transform:rotate(180deg)}
.perf{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.perf::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;border-left:2px dashed var(--cream)}
.perf b{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--red);font-size:7.5px;letter-spacing:.12em;font-weight:800;padding:4px 0}
.checks{height:100%;background:conic-gradient(var(--cream) 25%,var(--red) 0 50%,var(--cream) 0 75%,var(--red) 0) 0 0/14px 14px}
.text{padding:14px 8px 14px 14px;font-family:var(--display);font-size:16.5px;line-height:1.08;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.text.long{font-size:14px}
.seal{width:76px;height:76px;justify-self:center;margin-right:8px;position:relative;display:grid;place-items:center}
.seal svg{position:absolute;inset:0}
.seal i{font-style:normal;font-size:28px;position:relative;line-height:1}

/* Capa */
.cover{cursor:default;min-height:150px}
.cover .text{display:flex;flex-direction:column;gap:2px}
.cover .kicker{font-size:15px;letter-spacing:.08em}
.cover .big{font-size:clamp(24px,7.5vw,30px);line-height:.95}
.cover .rule{font-family:var(--body);font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;line-height:1.3}

/* Coringa */
.wild .text em{font-style:normal;display:block;font-family:var(--hand);font-size:22px;line-height:1;margin-top:4px;color:#fff}

.ticket.used{filter:grayscale(.85) brightness(.92)}
.usedmark{position:absolute;right:62px;top:50%;transform:translateY(-50%) rotate(-12deg);
  border:3px solid var(--stamp);color:var(--stamp);background:#fbe9deeb;font-family:var(--display);
  font-size:15px;letter-spacing:.06em;padding:4px 10px;border-radius:6px;text-align:center;line-height:1.05;pointer-events:none}
.usedmark small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.08em}

.empty{font-family:var(--hand);font-size:22px;color:var(--muted);text-align:center;padding:24px 0}
footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}

/* Folha do vale aberto */
.sheet{position:fixed;inset:0;background:#2a1414b3;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.panel{background:var(--paper);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel .emoji{font-size:44px;line-height:1}
.panel h2{font-family:var(--display);font-size:25px;line-height:1.05;margin:0;color:var(--red);text-wrap:balance}
.panel p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.panel .valid{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.panel label{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.panel textarea{font:inherit;font-family:var(--hand);font-size:24px;line-height:1.2;color:var(--ink);background:#fff;border:2px solid #2a141426;border-radius:12px;padding:10px 12px;min-height:84px;resize:vertical;width:100%;box-sizing:border-box}
.panel textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.btn{font:inherit;font-family:var(--display);font-size:16px;letter-spacing:.03em;border-radius:12px;padding:15px 16px;border:0;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--red);color:var(--cream)}
.btn.primary:active{background:var(--red-deep)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid #2a141433}
.confirm{font-family:var(--hand);font-size:22px;color:var(--red-deep);text-align:center}
.usedinfo{border:2px dashed var(--stamp);color:var(--stamp);border-radius:12px;padding:12px;font-weight:700;text-align:center}

@media (prefers-reduced-motion:reduce){.panel{animation:none}.ticket{transition:none}}
@media (max-width:360px){.ticket{grid-template-columns:50px 16px 12px 1fr 72px}.seal{width:64px;height:64px}.text{font-size:15px}.text.long{font-size:13px}}
</style>

</head>
<body>
<div class="wrap">
  <ul class="book" id="cover-slot"></ul>
  <p class="note">Escolhe um vale, me mostra, e eu cumpro.</p>

  <div class="bar"><div class="count" id="count"></div></div>
  <div class="tabs" id="tabs" role="group" aria-label="Filtrar vales"></div>
  <button class="luck" id="luck">Não sei qual escolher, sorteia um</button>

  <ul class="book" id="book"></ul>

  <footer>Válido até 08.10.2027 · Cada cupom pode ser usado uma vez · Toque num cupom para abrir</footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="emoji" id="sheet-emoji"></div>
    <h2 id="sheet-title"></h2>
    <p id="sheet-desc"></p>
    <div id="sheet-extra"></div>
    <div class="valid">Válido até 08.10.2027</div>
    <div class="actions" id="sheet-actions"></div>
  </div>
</div>

<script>
const NAME = "ISA";
const STORE_KEY = "cupons-isa-v2";
const WILD = "coringa";
const CATS = [
  {id:"escapada", n:"Escapadas"},
  {id:"postal", n:"Rio cartão-postal"},
  {id:"comer", n:"Comer bem"},
  {id:"aventura", n:"Aventuras"},
  {id:"casa", n:"Em casa"}
];
const VALES = [
  {c:"escapada", id:"ilhagrande", e:"🏝️", t:"Vale um fim de semana na Ilha Grande", d:"Barco saindo de Angra ou Conceição de Jacareí, praia de Lopes Mendes e pousada pé na areia. Você escolhe a data, eu reservo."},
  {c:"escapada", id:"paraty", e:"⛵", t:"Vale um fim de semana em Paraty", d:"Centro histórico de pedra, passeio de escuna pelas ilhas e jantar à luz de vela."},
  {c:"escapada", id:"buzios", e:"🌊", t:"Vale um fim de semana em Búzios", d:"Rua das Pedras à noite, praias diferentes a cada dia e pôr do sol na Orla Bardot."},
  {c:"escapada", id:"arraial", e:"🐠", t:"Vale um fim de semana em Arraial do Cabo", d:"O Caribe brasileiro: passeio de barco, Prainhas do Pontal do Atalaia e água transparente."},

  {c:"postal", id:"corcovado", e:"⛰️", t:"Vale um passeio ao Cristo, no Corcovado", d:"Subida de trem, a foto clássica de braços abertos e um açaí lá embaixo depois."},
  {c:"postal", id:"pao", e:"🚡", t:"Vale um pôr do sol no Pão de Açúcar com drinks no Clássico Sunset Club", d:"Bondinho no fim da tarde, mesa no Morro da Urca e o sol se pondo sobre a Guanabara. Ingressos e drinks por minha conta."},
  {c:"postal", id:"grumari", e:"🏖️", t:"Vale um dia de praia em Grumari", d:"Cadeira, guarda-sol, cooler e zero pressa. Na volta, paramos pra comer onde você quiser."},
  {c:"postal", id:"arpoador", e:"🌅", t:"Vale um pôr do sol no Arpoador", d:"A gente chega cedo, pega um lugar na pedra e aplaude o sol junto com o Rio inteiro."},
  {c:"postal", id:"piquenique", e:"🧺", t:"Vale um piquenique no Parque Lage com tudo preparado por mim", d:"Toalha, cesta montada e comidinhas que você gosta. Você só aparece."},
  {c:"postal", id:"turistas", e:"📸", t:"Vale um dia de turistas no Rio, com câmera, mapa e tudo", d:"Roteiro de quem acabou de chegar: museu, mirante, comida típica e muita foto."},

  {c:"comer", id:"musa", e:"🥐", t:"Vale um café da manhã no Musa, em São Conrado", d:"Pé na areia com a Pedra da Gávea de frente. A gente chega cedo e pede de tudo."},
  {c:"comer", id:"nusa", e:"🌺", t:"Vale um brunch no Nusa Café, em Ipanema", d:"Um pedaço de Bali em Ipanema: bowls, cafés bonitos e fotos para o feed."},
  {c:"comer", id:"skylab", e:"🍸", t:"Vale um drink no Skylab, no 30º andar em Copacabana", d:"A praia de Copacabana inteira lá embaixo. Vamos no fim da tarde pra pegar a luz bonita."},
  {c:"comer", id:"camolese", e:"🍷", t:"Vale um jantar na Casa Camolese com vista pro Cristo", d:"Jardim Botânico, o Jockey na frente e o Cristo iluminado no alto."},
  {c:"comer", id:"xian", e:"🥢", t:"Vale um jantar no Xian, no rooftop com vista pro Pão de Açúcar", d:"Comida chinesa contemporânea com a Baía de Guanabara, o Cristo e o Pão de Açúcar na mesma janela."},
  {c:"comer", id:"bira", e:"🦐", t:"Vale um almoço de domingo no Bira, em Guaratiba", d:"Frutos do mar com vista da Restinga de Marambaia, pertinho de casa e sem pressa de voltar."},
  {c:"comer", id:"flordoceu", e:"🌿", t:"Vale um jantar no Flor do Céu, no meio do verde", d:"Restaurante escondido perto do Dois Irmãos, com o mar lá embaixo. Clima de date de verdade."},
  {c:"comer", id:"senado", e:"🎶", t:"Vale uma noite no Centro: samba no Armazém Senado e jantar no Lilia", d:"Roda de samba num bar de 1907 e depois um dos menus degustação mais elogiados do Rio."},
  {c:"comer", id:"tematico", e:"🌍", t:"Vale um jantar temático feito por mim (você escolhe o país)", d:"Comida, música e bebida do país escolhido. Pode pedir difícil."},

  {c:"aventura", id:"aventura", e:"🧭", t:"Vale uma aventura nova que nunca fizemos juntos", d:"Algo que nenhum de nós dois fez ainda. Você sugere, eu organizo."},
  {c:"aventura", id:"radical", e:"🧗", t:"Vale uma tarde radical: kart, escalada, arvorismo, o que você topar", d:"Você escolhe a adrenalina, eu pago e tento não passar vergonha."},
  {c:"aventura", id:"surpresa", e:"🎈", t:"Vale um passeio surpresa", d:"Você só sabe a roupa que precisa usar. O resto é segredo até chegar."},
  {c:"aventura", id:"gps", e:"🚗", t:"Vale um “te levo onde quiser”: hoje você é o GPS", d:"Você aponta o caminho, eu dirijo e não pergunto “tem certeza?”."},
  {c:"aventura", id:"offline", e:"📵", t:"Vale um dia offline a dois", d:"Celulares guardados na gaveta do café da manhã até a hora de dormir."},

  {c:"casa", id:"cafe", e:"☕", t:"Vale um café da manhã na cama feito por mim", d:"Com tudo que você gosta, servido sem você precisar levantar."},
  {c:"casa", id:"filme", e:"🍿", t:"Vale uma noite de filmes com pipoca, cobertor e o filme que você escolher", d:"Sem reclamar da escolha e sem dormir no meio."},
  {c:"casa", id:"jogos", e:"🎲", t:"Vale uma noite de jogos e risadas", d:"Tabuleiro, cartas ou videogame. Quem perder lava a louça (que vai ser eu)."},
  {c:"casa", id:"massagem", e:"💆", t:"Vale uma massagem relaxante de 30 minutos", d:"Óleo, música calma e cronômetro ligado. Sem cobrar uma de volta."},
  {c:"casa", id:"domingo", e:"😴", t:"Vale um domingo preguiçoso com café, coberta e maratona de série", d:"Pijama o dia inteiro é obrigatório."},
  {c:"casa", id:"nada", e:"🛋️", t:"Vale um dia sem você fazer absolutamente nada: eu cuido de tudo", d:"Casa, comida, recados. Seu único trabalho é descansar."},
  {c:"casa", id:"louca", e:"🧽", t:"Vale uma semana livre da louça", d:"Sete dias em que a pia é problema meu."},
  {c:"casa", id:"cartinha", e:"✉️", t:"Vale uma cartinha escrita à mão contando o quanto você é importante pra mim", d:"Papel de verdade, caneta e sem limite de páginas."},
  {c:"casa", id:"doces", e:"🍫", t:"Vale uma caixa de chocolates e guloseimas surpresa montada por mim", d:"Escolhidos um por um, pensando em você."},
  {c:"casa", id:"presente", e:"🎁", t:"Vale um presente: aquilo que você está de olho faz tempo", d:"Me mostra o que é e o carrinho é meu."},
  {c:"casa", id:"diasim", e:"🙌", t:"Vale um dia de sim: não posso recusar nenhuma ideia sua", d:"Do café ao jantar, a resposta é sim. Com moderação, por favor."},
  {c:"casa", id:"desculpas", e:"🏳️", t:"Vale um pedido de desculpas garantido", d:"Mesmo que eu ache que estou certo. Use com sabedoria."}
];

const blank={used:{},wish:""};
function load(){try{return Object.assign({},blank,JSON.parse(localStorage.getItem(STORE_KEY))||{})}catch(e){return {...blank}}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
let state=load();
let filter="all";

const sealSVG=(()=>{const n=28,R=38,r=34,c=38;let p="";
  for(let i=0;i<n*2;i++){const a=Math.PI*i/n,rad=i%2?r:R;p+=(i?"L":"M")+(c+rad*Math.cos(a)).toFixed(2)+" "+(c+rad*Math.sin(a)).toFixed(2)}
  return `<svg viewBox="0 0 76 76" aria-hidden="true"><path d="${p}Z" fill="#fbe9de"/><circle cx="38" cy="38" r="25" fill="none" stroke="#d90f12" stroke-width="2"/></svg>`})();
const rays=cls=>`<svg class="${cls}" viewBox="0 0 30 14" aria-hidden="true"><g stroke="#fbe9de" stroke-width="2.4" stroke-linecap="round"><path d="M15 2v9"/><path d="M8 4l3 7"/><path d="M22 4l-3 7"/><path d="M2 8l6 4"/><path d="M28 8l-6 4"/></g></svg>`;
const stub=`<div class="stub">${rays("top")}<span>CUPOM<br>${NAME}</span>${rays("bot")}</div>
  <div class="perf"><b>VÁLIDO ATÉ 08.10.27</b></div><div class="checks"></div>`;

function fmt(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderCover(){
  document.getElementById("cover-slot").innerHTML=`<li><div class="ticket cover" role="img" aria-label="Parabéns, cupons da Isa">${stub}
    <div class="text"><span class="kicker">PARABÉNS</span><span class="big">CUPONS<br>${NAME}</span>
    <span class="rule">Regra: cada cupom só pode ser usado uma vez</span></div>
    <div class="seal">${sealSVG}<i>❤️</i></div></div></li>`;
}

function wildVale(){
  return {c:"wild",id:WILD,e:"✍️",
    t: state.wish?`Vale ${state.wish}`:"O último é você quem escolhe",
    d: state.wish?"O pedido que você mesma escreveu.":"Escreve aqui o que você quer. Vira um cupom como os outros, e eu cumpro."}
}

function renderTabs(){
  const opts=[["all","Todos"],...CATS.map(c=>[c.id,c.n]),["used","Usados"]];
  const t=document.getElementById("tabs");t.innerHTML="";
  opts.forEach(([id,n])=>{const b=document.createElement("button");b.className="tab";b.id="tab-"+id;b.textContent=n;
    b.setAttribute("aria-pressed",filter===id);b.addEventListener("click",()=>{filter=id;renderTabs();render()});t.appendChild(b)});
}
function ticketEl(v){
  const u=state.used[v.id];
  const li=document.createElement("li");
  const b=document.createElement("button");
  b.className="ticket"+(u?" used":"")+(v.id===WILD?" wild":"");
  b.setAttribute("aria-label",v.t+(u?", já usado":""));
  const txt=v.id===WILD&&!state.wish?`O último é você quem escolhe<em>toque pra escrever</em>`:esc(v.t);
  b.innerHTML=`${stub}<div class="text${v.t.length>62?" long":""}">${txt}</div>
    <div class="seal">${sealSVG}<i>${v.e}</i></div>
    ${u?`<div class="usedmark">USADO<small>${fmt(u)}</small></div>`:""}`;
  b.addEventListener("click",()=>openSheet(v.id));
  li.appendChild(b);return li;
}
function render(){
  renderCover();
  const all=[...VALES,wildVale()];
  const book=document.getElementById("book");book.innerHTML="";
  let list;
  if(filter==="used")list=all.filter(v=>state.used[v.id]);
  else if(filter==="all")list=all;
  else list=all.filter(v=>v.c===filter);
  if(!list.length){book.innerHTML=`<li class="empty">${filter==="used"?"Nenhum vale usado ainda.":"Nada por aqui."}</li>`}
  let last=null;
  list.forEach(v=>{
    if(filter==="all"&&v.c!==last){last=v.c;const cat=CATS.find(c=>c.id===v.c);
      if(cat){const h=document.createElement("li");h.className="cat";h.textContent=cat.n;book.appendChild(h)}
      else{const h=document.createElement("li");h.className="cat";h.textContent="Coringa";book.appendChild(h)}}
    book.appendChild(ticketEl(v));
  });
  const left=all.filter(v=>!state.used[v.id]).length;
  document.getElementById("count").textContent=`${left} de ${all.length} disponíveis`;
  document.getElementById("luck").hidden=left===0;
}

const sheet=document.getElementById("sheet");
function find(id){return id===WILD?wildVale():VALES.find(v=>v.id===id)}
function openSheet(id,mode){
  const v=find(id);
  document.getElementById("sheet-emoji").textContent=v.e;
  document.getElementById("sheet-title").textContent=mode==="lucky"?"A sorte escolheu:":v.t;
  document.getElementById("sheet-desc").textContent=mode==="lucky"?v.t:v.d;
  const x=document.getElementById("sheet-extra");x.innerHTML="";
  const a=document.getElementById("sheet-actions");a.innerHTML="";
  if(state.used[id]){
    a.innerHTML=`<div class="usedinfo">Vale usado em ${fmt(state.used[id])}</div>`;
    a.append(btn("Fechar","ghost",closeSheet));
  }else if(id===WILD&&(mode==="write"||!state.wish)){
    x.innerHTML=`<label for="wish">Vale…</label><textarea id="wish" maxlength="90" placeholder="um fim de semana em Petrópolis"></textarea>`;
    const ta=x.querySelector("textarea");ta.value=state.wish;
    const ok=btn("Salvar meu cupom","primary",()=>{state.wish=ta.value.trim().replace(/^vale\s+/i,"");save();render();openSheet(WILD)});
    ok.disabled=!ta.value.trim();ta.addEventListener("input",()=>ok.disabled=!ta.value.trim());
    a.append(ok,btn("Voltar","ghost",closeSheet));
    sheet.hidden=false;ta.focus();return;
  }else if(mode==="confirm"){
    a.innerHTML=`<div class="confirm">Certeza? Depois de carimbado, não volta.</div>`;
    a.append(btn("Sim, quero esse!","primary",()=>{state.used[id]=new Date().toISOString();save();render();openSheet(id)}));
    a.append(btn("Ainda não","ghost",()=>openSheet(id)));
  }else{
    a.append(btn("Usar este vale","primary",()=>openSheet(id,"confirm")));
    if(id===WILD)a.append(btn("Reescrever pedido","ghost",()=>openSheet(id,"write")));
    if(mode==="lucky")a.append(btn("Sortear outro","ghost",lucky));
    a.append(btn("Voltar","ghost",closeSheet));
  }
  sheet.hidden=false;
  a.querySelector("button")?.focus();
}
function closeSheet(){sheet.hidden=true}
function btn(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.addEventListener("click",fn);return b}
function lucky(){
  const pool=VALES.filter(v=>!state.used[v.id]);
  if(!pool.length){openSheet(WILD);return}
  openSheet(pool[Math.floor(Math.random()*pool.length)].id,"lucky");
}
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.getElementById("luck").addEventListener("click",lucky);
renderTabs();
render();
</script>

</body>
</html>
